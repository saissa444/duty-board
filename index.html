<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>在班表</title>
<meta name="theme-color" content="#1F4D3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="在班表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Layout: duty-board — sticky control strip, then one 24-hour lane strip per day, like the 勤務分配表 hour grid turned sideways */
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --ink:#1B2420; --muted:#5F6B66; --line:#D9DED9; --grid:#ECEFEB;
  --accent:#1F4D3F; --accent-ink:#FFFFFF; --mine:rgba(31,77,63,.10); --now:#C8331F;
  --pA:#C2410C; --pB:#7C3AED; --p1:#0E7490; --p2:#DB2777; --p3:#A16207; --p4:#2563EB; --pX:#6B7280;
  --display:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; --body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#1A201E; --ink:#E6ECE8; --muted:#97A39D; --line:#2C3531; --grid:#222A27;
  --accent:#8FD1B5; --accent-ink:#0E1513; --mine:rgba(143,209,181,.12); --now:#FF7A62;
  --pA:#D9541A; --pB:#8B5CF6; --p1:#0891B2; --p2:#DB2777; --p3:#A16207; --p4:#3B6FE0; --pX:#6B7280; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#1A201E; --ink:#E6ECE8; --muted:#97A39D; --line:#2C3531; --grid:#222A27;
  --accent:#8FD1B5; --accent-ink:#0E1513; --mine:rgba(143,209,181,.12); --now:#FF7A62;
  --pA:#D9541A; --pB:#8B5CF6; --p1:#0891B2; --p2:#DB2777; --p3:#A16207; --p4:#3B6FE0; --pX:#6B7280; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:900;font-size:1.6rem;letter-spacing:.04em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.label{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700;min-width:2.6em}
.chip{font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:12px;height:12px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));box-shadow:inset 0 0 0 1px var(--c,var(--accent));font-weight:700}
.chip.off{opacity:.45}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .wk{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;min-width:11em;text-align:center}
.today{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.today h2{margin:0;font-size:1rem;font-weight:700}
.today .who{display:flex;flex-wrap:wrap;gap:6px 14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.tag i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}
.tag .t{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dhead .date{font-family:var(--mono);font-weight:500;font-size:1.05rem;font-variant-numeric:tabular-nums}
.dhead .wd{font-weight:700}
.dhead .cnt{color:var(--muted);font-size:.82rem;margin-left:auto}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px}
.tl{position:relative;display:grid;grid-template-columns:4.6em 1fr;row-gap:4px;column-gap:8px}
.tl .nm{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.tl .nm.me{color:var(--ink);font-weight:700}
.lane{position:relative;height:20px;background:repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px calc(100%/24));border-radius:2px}
.bar{position:absolute;top:0;bottom:0;background:var(--c);border-radius:4px;overflow:hidden;display:flex;align-items:center;padding:0 6px;min-width:0}
.bar .star{font-weight:900;margin-right:3px;font-size:.95em}
.bar span{color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.bar.dim{opacity:.28}
.axis{grid-column:2;position:relative;height:14px;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.overlay{position:absolute;top:0;bottom:16px;left:calc(4.6em + 8px);right:0;pointer-events:none}
.mineband{position:absolute;top:-3px;bottom:-3px;background:var(--mine);border-left:1px dashed var(--accent);border-right:1px dashed var(--accent)}
.nowline{position:absolute;top:-4px;bottom:-2px;width:2px;background:var(--now);border-radius:1px}
.with{font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.watch{font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.watch .wl{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.watch .wl i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.sel{font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:.95rem;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:16px}
.otbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ids{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.ids summary{cursor:pointer;font-weight:700;font-size:.9rem}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.idgrid label{display:flex;align-items:center;gap:6px;font-size:.85rem}
.idgrid i{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.idgrid input{font:inherit;font-family:var(--mono);font-size:.85rem;width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);color:var(--ink)}
.otsum{display:flex;flex-wrap:wrap;gap:8px}
.otsum .pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;align-items:baseline;gap:8px}
.otsum .pill b{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table.ot{border-collapse:collapse;width:100%;min-width:720px;font-size:.85rem}
table.ot th{text-align:left;font-size:.75rem;letter-spacing:.06em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ot td{padding:4px 6px;border-bottom:1px solid var(--grid)}
table.ot input,table.ot select{font:inherit;font-size:.85rem;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:4px;width:100%;min-width:0}
table.ot input:hover,table.ot select:hover{border-color:var(--line)}
table.ot input:focus,table.ot select:focus{border-color:var(--accent);outline:none;background:var(--bg)}
table.ot .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.ot .del{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px}
table.ot .del:hover{color:var(--now)}
table.ot td.rm{display:flex;align-items:center;gap:6px;min-width:12em}
.pick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;touch-action:none;position:relative}
.pick:hover{border-color:var(--accent)}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.pick[aria-checked="true"]::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
table.ot tr.sel td{background:var(--mine)}
.bulk{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.bulk .bcount{font-weight:700;min-width:5.5em}
.bulk.idle{border-color:var(--line);box-shadow:none;position:static}
.bulk.idle .bcount{color:var(--muted);font-weight:400}
.bulk input{font:inherit;font-size:.9rem;flex:1 1 12em;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--ink)}
table.ot td.empty{text-align:center;color:var(--muted);padding:24px}
.detail{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.shift{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.shift .n{font-weight:700;display:flex;align-items:center;gap:6px}
.shift .n i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.shift .tm{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.shift .segs{grid-column:1/-1;font-size:.8rem;color:var(--muted);padding-left:16px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.confirm{display:inline-flex;gap:6px;align-items:center}
@media (max-width:520px){h1{font-size:1.3rem}.tl{grid-template-columns:3.6em 1fr}.overlay{left:calc(3.6em + 8px)}}
@media (prefers-reduced-motion:no-preference){.bar{transition:opacity .15s}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>在班表</h1>
      <p class="sub">依勤務分配表整理・點一天看各班勤務細項</p>
    </div>
    <div class="row">
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple hidden>
      <button class="btn primary" id="uploadBtn" type="button">＋ 上傳勤務分配表 PDF</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" id="tabDuty" role="tab" type="button" aria-selected="true">在班表</button>
    <button class="tab" id="tabOT" role="tab" type="button" aria-selected="false">加班時數</button>
  </nav>

  <div id="viewDuty" class="view">
  <div class="controls">
    <div class="row"><span class="label">我是</span><div class="row" id="meChips"></div></div>
    <div class="row"><span class="label">提醒</span>
      <select id="watchWho" class="sel" aria-label="提醒對象"></select>
      <select id="watchHour" class="sel" aria-label="幾點以後"><option value="12">12:00 後</option><option value="13">13:00 後</option><option value="14">14:00 後</option><option value="15">15:00 後</option><option value="16">16:00 後</option><option value="17">17:00 後</option><option value="18">18:00 後</option><option value="19">19:00 後</option><option value="20">20:00 後</option><option value="21">21:00 後</option><option value="22">22:00 後</option><option value="23">23:00 後</option></select>
      <span class="muted" style="font-size:.8rem">誰也在班</span>
    </div>
    <div class="row" style="justify-content:space-between">
      <div class="weeknav">
        <button class="btn" id="prevWk" type="button" aria-label="上一週">‹</button>
        <span class="wk" id="wkLabel">—</span>
        <button class="btn" id="nextWk" type="button" aria-label="下一週">›</button>
        <button class="btn" id="thisWk" type="button">本週</button>
      </div>
      <span class="muted" id="status" style="font-size:.8rem">離線可用・班表存在這台裝置</span>
    </div>
  </div>

  <section class="today" id="todayCard" hidden></section>
  <section class="days" id="days"></section>
  <div class="foot" id="foot"></div>
  </div>

  <div id="viewOT" class="view" hidden>
    <div class="otbar">
      <label class="row"><span class="label">月份</span><select id="otMonth" class="sel"></select></label>
      <div class="row">
        <button class="btn" id="otAdd" type="button">＋ 新增一筆</button>
        <button class="btn" id="otReset" type="button">依班表重新計算</button>
        <button class="btn primary" id="otExport" type="button">匯出 .xls</button>
      </div>
    </div>
    <details class="ids" id="otIds">
      <summary>人員編號（只匯出有填編號的人）</summary>
      <div class="idgrid" id="idGrid"></div>
    </details>
    <div class="otsum" id="otSum"></div>
    <div class="bulk" id="otBulk">
      <span class="bcount" id="otBulkCount">已選 0 筆</span>
      <input id="otBulkText" list="otRemarks" placeholder="新的備註，例：帶勤" autocomplete="off">
      <datalist id="otRemarks"></datalist>
      <button class="btn primary" id="otBulkApply" type="button">套用到已選</button>
      <button class="btn" id="otSelAll" type="button">全選</button>
      <button class="btn" id="otSelNone" type="button">取消選取</button>
    </div>
    <p class="sub" id="otSelHint">備註可多選：電腦按住 Shift 點選整段、Ctrl／⌘ 點選加選；手機按住備註左邊的圓鈕上下拖拉。</p>
    <div class="tablewrap"><table class="ot" id="otTable">
      <thead><tr><th>人員編號</th><th>姓名</th><th>類別</th><th>加班日期</th><th>開始時間</th><th>時數</th><th>備註</th><th></th></tr></thead>
      <tbody id="otBody"></tbody>
    </table></div>
    <p class="sub" id="otNote"></p>
    <p class="sub">計算方式：白天班前 9 小時為正常上班，超過的部分算加班（例：10:00–22:00 → 19:00 起 3 小時）。21:00 後起班跨夜者，隔日 06:00–09:00 算加班 3 小時；若 09:00 後繼續上班，超過 9 小時的部分也算。週六、週日標為「假日加班」，國定假日請手動改類別。</p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
// Parses a 勤務分配表 PDF (as text items) into shifts. Pure function, no DOM.
function parseDutyPages(pages) {
  const COLS = [[140,185,'值星'],[185,230,'帶勤'],[230,320,'業務整理'],[320,410,'指定處所待命'],
                [410,458,'基本教練(公差)'],[458,505,'機動待命'],[505,552,'常訓']];
  const pad = n => String(n).padStart(2,'0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
  const hours = {}; const names = {}; const days = [];
  for (const items of pages) {
    const all = items.map(i => i.str).join('');
    if (!all.includes('勤務分配表')) continue;
    const m = all.match(/(\d{3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if (!m) continue;
    const base = new Date(+m[1]+1911, +m[2]-1, +m[3], 8);
    days.push(`${base.getFullYear()}-${pad(base.getMonth()+1)}-${pad(base.getDate())}`);
    const its = items.filter(i => i.str.trim()).map(i => ({s:i.str.trim(), x:i.x, xc:i.x+i.w/2, yc:i.y+i.h/2}));
    for (const c of its) {
      if (c.x > 560 && c.x < 590 && /^[A-Z0-9]$/.test(c.s)) {
        const near = its.filter(v => Math.abs(v.yc-c.yc) < 5 && v.x > 595).sort((a,b)=>a.x-b.x);
        const nm = near.filter(v => v.x >= 690).map(v=>v.s).join('');
        const role = near.filter(v => v.x < 690).map(v=>v.s).join('');
        if (nm) names[c.s] = {name:nm, role};
      }
    }
    const rows = its.filter(i => /^\d\d-\d\d$/.test(i.s) && i.x < 130).sort((a,b)=>b.yc-a.yc);
    if (rows.length !== 25) throw new Error(`${days.at(-1)} 找到 ${rows.length} 個時段列（預期 25）`);
    rows.forEach((r, idx) => {
      const start = new Date(base.getTime() + idx*3600e3);
      for (const w of its) {
        if (Math.abs(w.yc - r.yc) < 8 && w.x > 130 && w.x < 552) {
          const col = COLS.find(([a,b]) => w.xc >= a && w.xc < b);
          if (!col) continue;
          for (const code of w.s.split(/[.．、,]/).map(s=>s.trim()).filter(Boolean)) {
            const h = ((hours[code] ||= {})[start.getTime()] ||= []);
            if (!h.includes(col[2])) h.push(col[2]);
          }
        }
      }
    });
  }
  const shifts = [];
  for (const [code, hs] of Object.entries(hours)) {
    const ts = Object.keys(hs).map(Number).sort((a,b)=>a-b);
    let block = [];
    const flush = () => {
      if (!block.length) return;
      const segs = [];
      for (const t of block) {
        const d = hs[t].join('、'); const last = segs.at(-1);
        if (last && last.duty === d && last.e === t) last.e = t+3600e3; else segs.push({s:t, e:t+3600e3, duty:d});
      }
      shifts.push({code, name: names[code]?.name || code, role: names[code]?.role || '',
        start: key(new Date(block[0])), end: key(new Date(block.at(-1)+3600e3)),
        segs: segs.map(g => ({s:key(new Date(g.s)), e:key(new Date(g.e)), d:g.duty}))});
      block = [];
    };
    for (const t of ts) { if (block.length && t !== block.at(-1)+3600e3) flush(); block.push(t); }
    flush();
  }

const PALETTE = {A:'var(--pA)',B:'var(--pB)','1':'var(--p1)','2':'var(--p2)','3':'var(--p3)','4':'var(--p4)'};

const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

function people(){

}
function shifts(){
  const seen = new Map();

// 值星官：每個「全員休假日」之後第一個上班的人，就是到下一個全員休假日為止的值星官
function dutyOfficers(all){
  const days = new Set();
  for (const w of Object.values(allWeeks())) {
    for (let t = parseT(w.firstDay+'T00:00'); dayKey(t) <= w.lastDay; t = parseT(dayKey(t+DAY+2*H)+'T00:00')) days.add(dayKey(t));
  }
  const sorted = [...days].sort();
  if (!sorted.length) return [];
  const isOff = k => { const a = parseT(k+'T00:00'), b = a + DAY; return !all.some(s => s.e > a && s.s < b); };
  // 斷點：資料開頭，以及每段連續休假日的結束
  const anchors = [parseT(sorted[0]+'T00:00')];
  for (let i = 0; i < sorted.length; i++) {
    const k = sorted[i];
    const prevDay = dayKey(parseT(k+'T00:00') - 12*H);
    if (i > 0 && sorted[i-1] !== prevDay) anchors.push(parseT(k+'T00:00'));  // 資料中斷，視為新的一段
    if (isOff(k)) anchors.push(parseT(k+'T00:00') + DAY);
  }
  const uniq = [...new Set(anchors)].sort((a,b)=>a-b);
  const out = [];
  uniq.forEach((from, i) => {
    const to = uniq[i+1] ?? Infinity;
    const first = all.find(s => s.s >= from && s.s < to);
    if (first && !out.some(o => o.from === first.s)) out.push({code: first.code, from: first.s, to});
  });
  return out;
}

const isOfficer = s => officers.some(o => o.code === s.code && s.s >= o.from && s.s < o.to);

// Minimal BIFF8 (.xls, Excel 97-2003) writer: one sheet of text cells.
// rows: [{cells:[...], style:'head'|'cell'|'note', height:twips?}]  styles: head = bordered + wrap, cell = bordered, note = red bold
function buildXls(sheetName, rows, colWidths){
  const parts = []; let len = 0;
  const rec = (type, bytes) => { const b = new Uint8Array(4 + bytes.length); const dv = new DataView(b.buffer);
    dv.setUint16(0, type, true); dv.setUint16(2, bytes.length, true); b.set(bytes, 4); parts.push(b); len += b.length; return b; };
  const u16 = (...v) => { const b = new Uint8Array(v.length*2); const dv = new DataView(b.buffer); v.forEach((x,i)=>dv.setUint16(i*2, x, true)); return b; };
  const cat = (...arrs) => { const n = arrs.reduce((s,a)=>s+a.length,0); const o = new Uint8Array(n); let p=0; for (const a of arrs){ o.set(a,p); p+=a.length; } return o; };
  const ustr16 = s => { const b = new Uint8Array(3 + s.length*2); const dv = new DataView(b.buffer); dv.setUint16(0, s.length, true); b[2]=1; for (let i=0;i<s.length;i++) dv.setUint16(3+i*2, s.charCodeAt(i), true); return b; };
  const ustr8 = s => { const b = new Uint8Array(2 + s.length*2); const dv = new DataView(b.buffer); b[0]=s.length; b[1]=1; for (let i=0;i<s.length;i++) dv.setUint16(2+i*2, s.charCodeAt(i), true); return b; };
  const hex = h => new Uint8Array(h.trim().split(/\s+/).map(x=>parseInt(x,16)));
  // ---- workbook globals
  rec(0x0809, u16(0x0600, 0x0005, 0x0DBB, 0x07CC, 0, 0, 0, 0).slice(0,16));
  rec(0x0042, u16(1200));                                   // CODEPAGE: UTF-16
  rec(0x003D, u16(0x0168, 0x001E, 0x3A98, 0x2328, 0x0038, 0, 0, 1, 0x0258)); // WINDOW1
  const font = (name, opt={}) => cat(u16(240, 0, opt.color ?? 0x7FFF, opt.bold ? 0x02BC : 0x0190, 0), new Uint8Array([0,0,0x88,0]), ustr8(name));
  for (let i=0;i<5;i++) rec(0x0031, font('新細明體'));        // FONT ×5 → indexes 0,1,2,3,5 (4 is skipped)
  rec(0x0031, font('新細明體', {color:0x000A, bold:true}));   // FONT index 6: red bold
  const styleXF = hex('00 00 00 00 F5 FF 20 00 00 F4 00 00 00 00 00 00 00 00 C0 20');
  for (let i=0;i<15;i++) rec(0x00E0, styleXF);
  rec(0x00E0, hex('00 00 00 00 01 00 20 00 00 00 00 00 00 00 00 00 00 00 C0 20'));   // XF 15: default cell
  const xf = (fontIx, align, border) => { const b = new Uint8Array(20); const dv = new DataView(b.buffer);
    dv.setUint16(0, fontIx, true); dv.setUint16(2, 49, true); dv.setUint16(4, 0x0001, true);   // text "@", locked
    b[6] = align; b[9] = 0x04 | 0x08 | 0x10 | (border ? 0x20 : 0);
    if (border) { dv.setUint32(10, (0x1111 | (8 << 16) | (8 << 23)) >>> 0, true); dv.setUint32(14, 8 | (8 << 7), true); }
    dv.setUint16(18, 0x20C0, true); return b; };
  rec(0x00E0, xf(0, 0x18, true));    // XF 16: header — wrap, vertically centred, thin borders
  rec(0x00E0, xf(0, 0x20, true));    // XF 17: data cell — bottom aligned, thin borders
  rec(0x00E0, xf(6, 0x20, false));   // XF 18: red bold note
  rec(0x0293, hex('00 80 00 FF'));                         // STYLE: Normal
  const bs = rec(0x0085, cat(new Uint8Array(4), u16(0), ustr8(sheetName)));  // BOUNDSHEET (offset patched below)
  const bsAt = len - bs.length;
  rec(0x000A, new Uint8Array(0));
  // ---- sheet
  const sheetStart = len;
  new DataView(bs.buffer).setUint32(4, sheetStart, true);
  rec(0x0809, u16(0x0600, 0x0010, 0x0DBB, 0x07CC, 0, 0, 0, 0).slice(0,16));
  const nRows = rows.length, nCols = Math.max(1, ...rows.map(r=>r.cells.length));
  const dim = new Uint8Array(14); const dd = new DataView(dim.buffer); dd.setUint32(0,0,true); dd.setUint32(4,nRows,true); dd.setUint16(8,0,true); dd.setUint16(10,nCols,true);
  rec(0x0200, dim);
  rec(0x023E, u16(0x06B6, 0, 0, 0x0040, 0, 0, 0, 0, 0));   // WINDOW2 (first sheet selected)
  (colWidths||[]).forEach((w,i) => { if (w) rec(0x007D, u16(i, i, Math.round(w*256), 15, 0, 0)); });
  const XF = {head:16, cell:17, note:18};
  rows.forEach((r, ri) => { if (r.height) { const b = new Uint8Array(16); const dv = new DataView(b.buffer);
    dv.setUint16(0, ri, true); dv.setUint16(2, 0, true); dv.setUint16(4, r.cells.length, true); dv.setUint16(6, r.height, true);
    dv.setUint32(12, (0x0140 | (15 << 16)) >>> 0, true); rec(0x0208, b); } });
  rows.forEach((r, ri) => r.cells.forEach((v, ci) => {
    const ix = XF[r.style] ?? 17;
    if (v === null || v === undefined || v === '') { if (r.style !== 'note') rec(0x0201, u16(ri, ci, ix)); return; }   // BLANK keeps the border
    rec(0x0204, cat(u16(ri, ci, ix), ustr16(String(v))));  // LABEL
  }));
  rec(0x000A, new Uint8Array(0));
  void bsAt;
  let wb = cat(...parts);
  if (wb.length < 4096) { const p = new Uint8Array(4096); p.set(wb); wb = p; }   // stay out of the mini stream
  return cfb(wb);
}
// Compound File Binary container holding one "Workbook" stream.
function cfb(stream){
  const SS = 512, nStream = Math.ceil(stream.length/SS);
  const dirSec = nStream;
  let nFat = 1; while (nStream + 1 + nFat > nFat*128) nFat++;
  const total = nStream + 1 + nFat;
  const out = new Uint8Array(SS * (1 + total)); const dv = new DataView(out.buffer);
  const sig = [0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1]; sig.forEach((b,i)=>out[i]=b);
  dv.setUint16(24, 0x003E, true); dv.setUint16(26, 3, true); dv.setUint16(28, 0xFFFE, true);
  dv.setUint16(30, 9, true); dv.setUint16(32, 6, true);
  dv.setUint32(44, nFat, true); dv.setUint32(48, dirSec, true); dv.setUint32(56, 4096, true);
  dv.setUint32(60, 0xFFFFFFFE, true); dv.setUint32(64, 0, true); dv.setUint32(68, 0xFFFFFFFE, true); dv.setUint32(72, 0, true);
  for (let i=0;i<109;i++) dv.setUint32(76+i*4, i < nFat ? nStream + 1 + i : 0xFFFFFFFF, true);
  out.set(stream, SS);
  // directory
  const d = SS * (1 + dirSec);
  const entry = (off, name, type, child, start, size) => {
    for (let i=0;i<name.length;i++) dv.setUint16(off+i*2, name.charCodeAt(i), true);
    dv.setUint16(off+64, (name.length+1)*2, true); out[off+66]=type; out[off+67]=1;
    dv.setUint32(off+68, 0xFFFFFFFF, true); dv.setUint32(off+72, 0xFFFFFFFF, true); dv.setUint32(off+76, child, true);
    dv.setUint32(off+116, start, true); dv.setUint32(off+120, size, true);
  };
  entry(d, 'Root Entry', 5, 1, 0xFFFFFFFE, 0);
  entry(d+128, 'Workbook', 2, 0xFFFFFFFF, 0, stream.length);
  for (const off of [d+256, d+384]) { dv.setUint32(off+68,0xFFFFFFFF,true); dv.setUint32(off+72,0xFFFFFFFF,true); dv.setUint32(off+76,0xFFFFFFFF,true); }
  // FAT
  const fat = SS * (1 + nStream + 1);
  for (let i=0;i<nFat*128;i++) {
    let v = 0xFFFFFFFF;
    if (i < nStream) v = i === nStream-1 ? 0xFFFFFFFE : i+1;
    else if (i === dirSec) v = 0xFFFFFFFE;
    else if (i > dirSec && i <= dirSec + nFat) v = 0xFFFFFFFD;
    dv.setUint32(fat + i*4, v, true);
  }
  return out;
}

// ================= 加班時數 =================
const OT_CATS = ['平時加班','假日加班','平日公假','假日公假','平日公差','假日公差','寒暑補休','公務加班','值勤補休','超時服勤','假日補休','核派補休'];
const OT_REMARK = '備勤(值星)';
const ymd = t => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + pad(d.getMinutes()); };
let otIds = readJSON('duty-ids', {});
let otEdits = readJSON('duty-ot-v1', {});
let otMonth = null;
let otSel = new Set(), otAnchor = null;
// 一個班 → 加班紀錄
function otForShift(s){
  const out = [];
  const add = (from, hrs) => { if (hrs > 0) out.push({start: from, hours: hrs}); };
  const dayPart = (from, to) => { const len = (to - from) / H; if (len > 9) add(from + 9*H, len - 9); };
  const startHour = new Date(s.s).getHours();
  const crosses = dayKey(s.e - 1) !== dayKey(s.s);
  if (crosses && startHour >= 18) {
    const nextMid = parseT(dayKey(s.s + DAY) + 'T00:00');
    const a = Math.max(s.s, nextMid + 6*H), b = Math.min(s.e, nextMid + 9*H);
    if (b > a) add(a, (b - a) / H);
    if (s.e > nextMid + 9*H) dayPart(nextMid + 9*H, s.e);
  } else dayPart(s.s, s.e);
  return out;
}
function otComputed(month, all, ps){
  const rows = [];
  const withId = ps.filter(p => (otIds[p.name]||'').trim());
  const targets = withId.length ? withId : ps;
  for (const p of targets) for (const s of all.filter(x => x.code === p.code)) for (const o of otForShift(s)) {
    if (ymd(o.start).slice(0,7) !== month) continue;
    const wd = new Date(o.start).getDay();
    rows.push({id: (otIds[p.name]||'').trim(), name: p.name, cat: (wd===0||wd===6) ? '假日加班' : '平時加班',
               date: ymd(o.start), time: hhmm(o.start), hours: String(o.hours), remark: OT_REMARK, _t: o.start});
  }
  rows.sort((a,b) => a.name.localeCompare(b.name, 'zh-Hant') || a._t - b._t);
  return rows.map(({_t, ...r}) => r);
}
function otMonths(all){
  const set = new Set();
  for (const w of Object.values(allWeeks())) { set.add(w.firstDay.slice(0,7).replace('-','/')); set.add(w.lastDay.slice(0,7).replace('-','/')); }
  for (const s of all) for (const o of otForShift(s)) set.add(ymd(o.start).slice(0,7));
  return [...set].sort();
}
function otRows(all, ps){ return otEdits[otMonth] ? otEdits[otMonth] : otComputed(otMonth, all || shifts(), ps || people()); }
function otSave(rows){ otEdits[otMonth] = rows; writeJSON('duty-ot-v1', otEdits); }
function renderOT(all, ps){
  all = all || shifts(); ps = ps || people();
  const months = otMonths(all);
  const sel = $('otMonth');
  if (!otMonth || !months.includes(otMonth)) {
    const now = ymd(Date.now()).slice(0,7);
    otMonth = months.includes(now) ? now : months.at(-1) || now;
  }
  sel.innerHTML = (months.length ? months : [otMonth]).map(m => `<option value="${m}"${m===otMonth?' selected':''}>${m.replace('/', ' 年 ')} 月</option>`).join('');
  // 人員編號
  $('idGrid').innerHTML = ps.map(p => `<label style="--c:${color(p.code)}"><i></i><span style="white-space:nowrap">${esc(p.name)}</span><input id="id-${esc(p.code)}" data-name="${esc(p.name)}" value="${esc(otIds[p.name]||'')}" placeholder="例 A0557" autocomplete="off"></label>`).join('') || '<span class="muted">上傳班表後會列出人員</span>';
  if (!Object.values(otIds).some(v => (v||'').trim())) $('otIds').open = true;
  const rows = otRows(all, ps);
  // 合計
  const tot = {}; for (const r of rows) tot[r.name] = (tot[r.name]||0) + (parseFloat(r.hours)||0);
  $('otSum').innerHTML = Object.entries(tot).map(([n,h]) => { const p = ps.find(x=>x.name===n); return `<span class="pill" style="--c:${p?color(p.code):'var(--pX)'}"><span class="tag"><i></i>${esc(n)}</span><b>${h}</b><span class="muted">小時・${rows.filter(r=>r.name===n).length} 筆</span></span>`; }).join('');
  const opt = v => OT_CATS.map(c => `<option${c===v?' selected':''}>${c}</option>`).join('') + (OT_CATS.includes(v) ? '' : `<option selected>${esc(v)}</option>`);
  otSel = new Set([...otSel].filter(i => i < rows.length));
  $('otBody').innerHTML = rows.length ? rows.map((r,i) => `<tr data-i="${i}"${otSel.has(i)?' class="sel"':''}>
    <td><input class="mono" data-k="id" value="${esc(r.id)}" style="width:6.5em"></td>
    <td><input data-k="name" value="${esc(r.name)}" style="width:5.5em"></td>
    <td><select data-k="cat">${opt(r.cat)}</select></td>
    <td><input class="mono" data-k="date" value="${esc(r.date)}" style="width:7.5em" inputmode="numeric"></td>
    <td><input class="mono" data-k="time" value="${esc(r.time)}" style="width:4.5em" inputmode="numeric"></td>
    <td><input class="mono" data-k="hours" value="${esc(r.hours)}" style="width:3.5em" inputmode="decimal"></td>
    <td class="rm"><span class="pick" role="checkbox" tabindex="0" aria-checked="${otSel.has(i)}" aria-label="選取第 ${i+1} 筆備註" data-pick="${i}"></span><input data-k="remark" value="${esc(r.remark)}" list="otRemarks"></td>
    <td><button class="del" type="button" aria-label="刪除這筆" data-del="${i}">✕</button></td></tr>`).join('')
    : `<tr><td colspan="8" class="empty">這個月沒有算出加班。可按「＋ 新增一筆」手動加入。</td></tr>`;
  $('otRemarks').innerHTML = [...new Set([OT_REMARK, '帶勤', '業務整理', '值星', '機動待命', ...rows.map(r => r.remark).filter(Boolean)])].map(v => `<option value="${esc(v)}">`).join('');
  renderBulk();
  const missing = rows.some(r => !r.id);
  $('otNote').textContent = (otEdits[otMonth] ? '這個月已手動修改；按「依班表重新計算」可還原。' : '依班表自動計算。') + (missing ? ' 有幾筆沒有人員編號，請在上方「人員編號」填寫。' : '');
}
function otValidate(rows){
  const bad = [];
  rows.forEach((r,i) => {
    if (!/^\d{4}\/\d{2}\/\d{2}$/.test(r.date)) bad.push(`第 ${i+1} 筆日期要寫成 2026/10/05 這種 10 碼格式`);
    if (!/^\d{4}$/.test(r.time)) bad.push(`第 ${i+1} 筆開始時間要寫成 4 碼，例如 0600、1800`);
    if (!r.id) bad.push(`第 ${i+1} 筆（${r.name}）沒有人員編號`);
  });
  return bad;
}
async function otExport(){
  const rows = otRows();
  if (!rows.length) { toast('這個月沒有資料可以匯出'); return; }
  const bad = otValidate(rows);
  if (bad.length) { toast(bad[0] + (bad.length > 1 ? `（另有 ${bad.length-1} 個問題）` : '')); return; }
  const sheet = [
    {cells:['人員編號','姓名','類別','加班日期(例：2008/01/01)','申請加班、公差的開始時間(例：0800、1600、1700)','可補休時數\n(不包括公假)','','備註'], style:'head', height:900},
    ...rows.map(r => ({cells:[r.id, r.name, r.cat, r.date, r.time, r.hours, '', r.remark], style:'cell', height:340})),
    {cells:['請務必依照範例的格式輸入資料，才不會造成匯入資料有誤，而出現錯誤訊息。'], style:'note', height:340},
    {cells:['加班日期的格式為：包含 / 斜線，共10碼(2008/09/01)。切勿輸入2008/9/1。'], style:'note', height:340}
  ];
  const bytes = buildXls('Sheet1', sheet, [10.87,9.25,14.99,13.5,17.87,10.74,9.5,28.99]);
  const name = `OT_${otMonth.replace("/","")}.xls`;
  const file = new File([bytes], name, {type:'application/vnd.ms-excel'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      await navigator.share({files:[file], title:name}); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`已匯出 ${name}`);
}
// 事件
function showTab(t){
  const ot = t === 'ot';
  $('viewDuty').hidden = ot; $('viewOT').hidden = !ot;
  $('tabDuty').setAttribute('aria-selected', String(!ot)); $('tabOT').setAttribute('aria-selected', String(ot));
  try { localStorage.setItem('duty-tab', t); } catch {}
  if (ot) renderOT();
}
$('tabDuty').onclick = () => showTab('duty');
$('tabOT').onclick = () => showTab('ot');
$('otMonth').onchange = e => { otMonth = e.target.value; otSel.clear(); renderOT(); };
// ---- 備註多選 ----
function renderBulk(){
  const n = otSel.size;
  $('otBulk').classList.toggle('idle', n === 0);
  $('otBulkCount').textContent = n ? `已選 ${n} 筆` : '尚未選取';
  $('otBulkApply').disabled = n === 0; $('otSelNone').disabled = n === 0;
  for (const tr of $('otBody').querySelectorAll('tr[data-i]')) {
    const on = otSel.has(+tr.dataset.i); tr.classList.toggle('sel', on);
    const pk = tr.querySelector('.pick'); if (pk) pk.setAttribute('aria-checked', String(on));
  }
}
function selRange(a, b, base){
  const next = new Set(base || []); const [lo, hi] = a < b ? [a, b] : [b, a];
  for (let i = lo; i <= hi; i++) next.add(i);
  otSel = next; renderBulk();
}
function selClick(i, e){
  if (e.shiftKey && otAnchor !== null) { selRange(otAnchor, i, e.ctrlKey || e.metaKey ? otSel : null); return; }
  if (otSel.has(i)) otSel.delete(i); else otSel.add(i);
  otAnchor = i; renderBulk();
}
// 圓鈕：點選、Shift 範圍、按住拖拉（滑鼠或手指）
let drag = null;
$('otBody').addEventListener('pointerdown', e => {
  const pk = e.target.closest('[data-pick]');
  if (pk) {
    e.preventDefault();
    const i = +pk.dataset.pick;
    if (e.shiftKey || e.ctrlKey || e.metaKey) { selClick(i, e); return; }
    const adding = !otSel.has(i);
    drag = {start: i, base: new Set(otSel), adding, moved: false, id: e.pointerId};
    try { pk.setPointerCapture(e.pointerId); } catch {}
    return;
  }
  // Shift／Ctrl 點備註格本身也能選
  const inp = e.target.closest('input[data-k="remark"]');
  if (inp && (e.shiftKey || e.ctrlKey || e.metaKey)) { e.preventDefault(); selClick(+inp.closest('tr').dataset.i, e); }
});
function dragTo(x, y){
  const el = document.elementFromPoint(x, y);
  const tr = el && el.closest('#otBody tr[data-i]'); if (!tr) return;
  const j = +tr.dataset.i; if (j === drag.start && !drag.moved) return;
  drag.moved = true;
  const [lo, hi] = drag.start < j ? [drag.start, j] : [j, drag.start];
  const next = new Set(drag.base);
  for (let k = lo; k <= hi; k++) drag.adding ? next.add(k) : next.delete(k);
  otSel = next; renderBulk();
}
let scrollTimer = null;
function autoScroll(y){
  clearInterval(scrollTimer); scrollTimer = null;
  const edge = 70, h = window.innerHeight;
  const dir = y > h - edge ? 1 : y < edge ? -1 : 0;
  if (!dir) return;
  scrollTimer = setInterval(() => { if (!drag) { clearInterval(scrollTimer); return; } window.scrollBy(0, dir * 14); dragTo(drag.x, drag.y); }, 30);
}
$('otBody').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY; autoScroll(e.clientY);
  dragTo(e.clientX, e.clientY);
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  clearInterval(scrollTimer); scrollTimer = null;
  if (!drag.moved) { drag.adding ? otSel.add(drag.start) : otSel.delete(drag.start); renderBulk(); }
  otAnchor = drag.start; drag = null;
};
$('otBody').addEventListener('pointerup', endDrag);
$('otBody').addEventListener('pointercancel', endDrag);
$('otBody').addEventListener('keydown', e => {
  const pk = e.target.closest('[data-pick]');
  if (pk && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); selClick(+pk.dataset.pick, e); }
});
$('otBulkApply').onclick = () => {
  const v = $('otBulkText').value.trim();
  if (!otSel.size) return;
  if (!v) { toast('請先輸入要套用的備註'); $('otBulkText').focus(); return; }
  const rows = otRows().map((r, i) => otSel.has(i) ? {...r, remark: v} : {...r});
  const n = otSel.size; otSave(rows); otSel.clear(); $('otBulkText').value = ''; renderOT(); toast(`已修改 ${n} 筆備註`);
};
$('otBulkText').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('otBulkApply').click(); } });
$('otSelAll').onclick = () => { otSel = new Set(otRows().map((_, i) => i)); renderBulk(); };
$('otSelNone').onclick = () => { otSel.clear(); otAnchor = null; renderBulk(); };
$('idGrid').addEventListener('change', e => {
  const inp = e.target.closest('input'); if (!inp) return;
  otIds[inp.dataset.name] = inp.value.trim().toUpperCase(); writeJSON('duty-ids', otIds);
  // 已手動修改的月份：把空白編號補上
  for (const m of Object.keys(otEdits)) otEdits[m] = otEdits[m].map(r => (r.name === inp.dataset.name && !r.id) ? {...r, id: otIds[r.name]} : r);
  writeJSON('duty-ot-v1', otEdits);
  renderOT();
});
$('otBody').addEventListener('change', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  const i = +el.closest('tr').dataset.i; const rows = otRows().map(r => ({...r}));
  rows[i][el.dataset.k] = el.value.trim(); otSave(rows); renderOT();
});
$('otBody').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const rows = otRows().filter((_, i) => i !== +b.dataset.del); otSel.clear(); otSave(rows); renderOT(); toast('已刪除一筆');
});
$('otAdd').onclick = () => {
  const rows = otRows().map(r => ({...r})); const last = rows.at(-1);
  const p = people().find(x => x.code === me) || people()[0] || {name:''};
  rows.push({id: last?.id || otIds[p.name] || '', name: last?.name || p.name, cat:'平時加班', date: otMonth + '/01', time:'1800', hours:'3', remark: OT_REMARK});
  otSave(rows); renderOT();
};
$('otReset').onclick = () => { otSel.clear(); delete otEdits[otMonth]; writeJSON('duty-ot-v1', otEdits); renderOT(); toast('已依班表重新計算'); };
$('otExport').onclick = otExport;
try { if (localStorage.getItem('duty-tab') === 'ot') showTab('ot'); } catch {}

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('離線功能未啟用', err));
}
